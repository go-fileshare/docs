name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A pull request builds with --strict and publishes nothing. That is the
  # whole reason this job is split from the deploy below: a broken nav entry,
  # a dead internal link or a missing asset should fail the PR rather than be
  # discovered on the published site. go-virtio/docs has no such job, and its
  # mkdocs.yml has pointed extra_css at a stylesheets/brand.css that does not
  # exist -- exactly the class of thing --strict catches.
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: mkdocs build --strict

  # ⛔ mkdocs --strict RESOLVES LINKS BETWEEN DOCUMENTS AND FETCHES NOTHING.
  # An https:// URL is text to it. cloud-boot/docs published a link to a
  # repository that did not exist for ten weeks, with a green strict build the
  # whole time, which is what this job exists to prevent here.
  links:
    name: every external link resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check
        run: |
          set -uo pipefail
          # The character class matters: an extractor stopping only at ) and "
          # carries a closing > or < into the request.
          urls=$(grep -rhoE 'https?://[^)">< [:space:]]+' docs/ README.md | sed -E 's/[.,`]+$//' | sort -u)
          test -n "$urls" || { echo "::error::no links found; are the docs still there?"; exit 1; }
          echo "checking $(printf '%s\n' "$urls" | wc -l) distinct URLs"
          fail=0
          while read -r u; do
            case "$u" in
              # Renders whatever it is asked for; proves nothing.
              *img.shields.io*) continue ;;
              # Documented placeholders, not hosts.
              *example.com*|*example.org*|*example.net*|*localhost*|*127.0.0.1*|*.invalid*) continue ;;
            esac
            # Three attempts: one is a flake detector rather than a link
            # checker, and a lane that fails at random gets ignored.
            code=000
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 "$u" 2>/dev/null) || true
              code=${code:-000}
              case "$code" in 2*|3*) break ;; esac
              sleep 3
            done
            case "$code" in
              2*|3*) printf '  ok   %s  %s\n' "$code" "$u" ;;
              *)     printf '  FAIL %s  %s\n' "$code" "$u"; fail=1 ;;
            esac
          done <<< "$urls"
          test "$fail" -eq 0 || { echo "::error::at least one link does not resolve"; exit 1; }

  deploy:
    name: publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # mike publishes versioned docs to gh-pages; Pages serves that branch at
      # https://go-fileshare.github.io/docs/. main is labelled "0.4", aliased
      # "latest", tracking the fileshare release it documents.
      - name: Deploy versioned docs
        run: |
          git fetch origin gh-pages --depth=1 || true
          mike deploy --push --update-aliases 0.4 latest
          mike set-default --push latest
