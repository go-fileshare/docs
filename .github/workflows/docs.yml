name: docs

# Every documentation version is a separate Hugo build, published under
# https://go-fileshare.github.io/docs/<version>/ on the gh-pages branch, where
# <version> is the minor version of fileshare the pages describe
# (params.fileshare.version in hugo.yaml: v0.22.2 -> 0.22). main is that
# version's source: each push to main replaces /docs/<version>/, and
# /docs/latest/ follows the newest. Pull requests build and check, and publish
# nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Optional. A released tag (vMAJOR.MINOR.PATCH) to rebuild and republish
          under its own version directory, for example to restore an old
          version. Leave empty to build main. A tag run replaces only that
          version's directory: never latest, versions.json or the root.
        required: false
        default: ""
        type: string

# The build needs nothing beyond the source. Write access to the repository
# is granted to the deploy job alone, below, so a pull request build cannot
# push to gh-pages.
permissions:
  contents: read

env:
  HUGO_VERSION: "0.167.0"
  # sha256 of hugo_${HUGO_VERSION}_linux-amd64.tar.gz, from the release's checksums.txt.
  HUGO_SHA256: "4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169"
  DOCS_URL: "https://go-fileshare.github.io/docs"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      only: ${{ steps.ref.outputs.only }}
    steps:
      # A dispatched ref is validated BEFORE checkout, and passed through the
      # environment, never interpolated into the script.
      - name: Validate the dispatched ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -z "${INPUT_REF}" ]; then
            echo "only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "${INPUT_REF}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::ref must be a released tag vMAJOR.MINOR.PATCH, not \"${INPUT_REF}\""
            exit 1
          fi
          echo "only=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Empty on a push or a plain dispatch: the triggering commit. A
          # validated tag otherwise, spelled out so a branch of that name
          # cannot be taken for it.
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || '' }}
          # themes/hextra (the tannevaled/hextra fork, pinned to a release tag)
          # and branding (go-fileshare/brand) are submodules.
          submodules: recursive
          # The whole history: each page's creation and modification come from git.
          fetch-depth: 0

      - name: Install Hugo ${{ env.HUGO_VERSION }}
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      # The version label is fileshare's minor version, read from hugo.yaml,
      # and it is the last segment of baseURL: the version selector reads it there.
      - name: Version
        id: version
        run: |
          fileshare=$(hugo config --format json | jq -r '.params.fileshare.version')
          version=$(printf '%s\n' "${fileshare}" | sed -nE 's/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/\1.\2/p')
          if [ -z "${version}" ]; then
            echo "::error::params.fileshare.version in hugo.yaml is \"${fileshare}\", not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "fileshare ${fileshare}: documentation version ${version}"

      # The translations keep what a translation must not change: every page
      # in every language, every code block (comments inside configuration
      # examples are translated on purpose here, hence --comments), every
      # heading's anchor, every relref and weight. Checked by go-fleettools'
      # i18ncheck, pinned. Until 2026-10-25 this site ran it by hand only,
      # as seven languages arrived; go-authn/docs runs it in CI.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Translations
        run: go run github.com/go-fleettools/fleettools/cmd/i18ncheck@v0.36.0 --comments content

      # Each page's creation (first commit, followed across renames) and its
      # author, for the page history at its foot (params.page.history).
      - name: Page history
        run: |
          mkdir -p data
          go run github.com/tannevaled/hextra/cmd/pagehistory@v0.21.0 > data/pagehistory.json

      # --panicOnWarning: a deprecated setting or a template warning fails the
      # build rather than scrolling by. A broken {{< relref >}} is an error.
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: >-
          hugo --gc --minify --panicOnWarning --printPathWarnings
          --baseURL "${DOCS_URL}/${{ steps.version.outputs.version }}/"

      # Internal links and anchors, offline, with the site laid out under
      # /docs/<version>/ as it is served.
      - name: Lay out the site for the link check
        run: |
          mkdir -p _check/docs
          cp -R public "_check/docs/${{ steps.version.outputs.version }}"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --include-fragments
            --index-files index.html
            --root-dir ${{ github.workspace }}/_check
            '_check/docs/**/*.html'
          fail: true

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          retention-days: 7

  # The offline check above proves the site's own links and anchors. An
  # https:// URL is text to it: this job fetches each one the pages name.
  links:
    name: every external link resolves
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # linkcheck (go-fleettools/fleettools, pinned): retries with exponential
      # backoff that honours Retry-After, github.com repo and path links decided
      # through the REST API rather than the HTML page, a DEAD link told apart
      # from a FLAKY host. It already skips img.shields.io, example domains
      # and localhost.
      #
      # --skip: a per-account ACME directory prefix, a template whose <uuid>
      # tail the extractor stops at; the host is real, the URL is not.
      #
      # THE ONE DELIBERATE EXCEPTION to "no secret on a command line or in the
      # environment": the job's ephemeral, read-only github.token (permissions:
      # contents: read, for this job alone) reaches the tool as a 0600 file in
      # RUNNER_TEMP, written by the shell builtin printf (no process argument,
      # no environment variable) and removed on exit. It is sent to
      # api.github.com only and never printed.
      - name: Check
        run: |
          umask 077
          token="${RUNNER_TEMP}/linkcheck-token"
          trap 'rm -f "${token}"' EXIT
          printf '%s' '${{ github.token }}' > "${token}"
          go run github.com/go-fleettools/fleettools/cmd/linkcheck@v0.74.0 \
            --token-file "${token}" \
            --skip acme-v02.harica.gr/acme/ \
            content/ README.md

  deploy:
    # Only main publishes. A pull request stops after build above: it has no
    # business pushing to gh-pages.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    # Never two deploys at once: both would push gh-pages and the second would
    # be rejected. cancel-in-progress stays false -- killing a publish half way
    # through is worse than making it wait.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The publishing script, from the commit being published.
      - uses: actions/checkout@v7
        with:
          path: source

      # The published site. Only the version being built is replaced; every
      # other version (the MkDocs-built 0.4 to 0.21) stays as it is.
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # --only for a dispatched tag: that version's directory alone.
      - name: Publish ${{ needs.build.outputs.version }}
        env:
          ONLY: ${{ needs.build.outputs.only }}
        run: |
          flag=""
          if [ "${ONLY}" = "true" ]; then flag="--only"; fi
          source/scripts/publish-version.sh ${flag} "${{ needs.build.outputs.version }}" site gh-pages

      - name: Push gh-pages
        working-directory: gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "Deployed ${GITHUB_SHA::7} to ${{ needs.build.outputs.version }} with Hugo ${HUGO_VERSION}"
          git push origin HEAD:gh-pages
